 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Workbench</title>
<style>
  body { margin:0; padding:16px; font-family:sans-serif; background:linear-gradient(135deg,#0f172a,#1e1b4b,#311042); color:#fff; min-height:100vh; }
  header { background:rgba(255,255,255,0.1); padding:14px 20px; border-radius:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  button, select { background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.25); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  button.add { background:#0284c7; border:none; font-weight:bold; }
  select option { background:#1e293b; color:#fff; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .top { display:flex; justify-content:space-between; gap:8px; }
  input.title { background:transparent; border:none; color:#fff; font-size:16px; font-weight:bold; width:100%; outline:none; }
  .tools { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
  .dots { display:flex; gap:6px; align-items:center; }
  .dot { width:18px; height:18px; border-radius:50%; border:2px solid #fff; cursor:pointer; }
  textarea { width:100%; height:140px; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:10px; color:#fff; font-size:15px; resize:vertical; outline:none; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
</style>
</head>
<body>

<header>
  <strong style="font-size:20px;">⚡ Bento Workbench</strong>
  <div>
    <button class="add" onclick="newCard()">+ New Card</button>
    <button onclick="downloadTxt()">⬇ Export</button>
  </div>
</header>

<div id="grid"></div>

<script>
var notes = JSON.parse(localStorage.getItem('wb_data')) || [
  { title: 'My Note', text: 'Write here and click Copy!', font: 'sans-serif', bg: 'rgba(56,189,248,0.18)', color: '#ffffff' }
];

function save() {
  localStorage.setItem('wb_data', JSON.stringify(notes));
}

function newCard() {
  notes.unshift({ title: '', text: '', font: 'sans-serif', bg: 'rgba(255,255,255,0.1)', color: '#ffffff' });
  save();
  draw();
}

function delCard(i) {
  if (notes.length > 1) { notes.splice(i, 1); save(); draw(); }
}

function copyIt(i, type) {
  var t = notes[i].text;
  if (type === 'upper') t = t.toUpperCase();
  if (type === 'md') t = '### ' + (notes[i].title || 'Note') + '\n' + t;
  var el = document.createElement('textarea');
  el.value = t;
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  alert('Copied!');
}

function downloadTxt() {
  var all = notes.map(function(n){ return n.title + ':\n' + n.text; }).join('\n\n---\n\n');
  var a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(all);
  a.download = 'notes.txt';
  a.click();
}

function draw() {
  var g = document.getElementById('grid');
  g.innerHTML = '';
  for (var i = 0; i < notes.length; i++) {
    (function(idx){
      var n = notes[idx];
      var d = document.createElement('div');
      d.className = 'card';
      d.style.background = n.bg;
      d.innerHTML =
        '<div class="top">' +
          '<input class="title" placeholder="Title..." value="' + n.title.replace(/"/g, '&quot;') + '" oninput="notes['+idx+'].title=this.value;save()">' +
          '<button onclick="delCard('+idx+')">✕</button>' +
        '</div>' +
        '<div class="tools">' +
          '<select onchange="notes['+idx+'].font=this.value;save();draw()">' +
            '<option value="sans-serif"'+(n.font=='sans-serif'?' selected':'')+'>Sans</option>' +
            '<option value="Georgia,serif"'+(n.font=='Georgia,serif'?' selected':'')+'>Serif</option>' +
            '<option value="monospace"'+(n.font=='monospace'?' selected':'')+'>Code</option>' +
          '</select>' +
          '<div class="dots">' +
            '<input type="color" value="'+n.color+'" onchange="notes['+idx+'].color=this.value;save();draw()">' +
            '<span class="dot" style="background:#38bdf8" onclick="notes['+idx+'].bg=\'rgba(56,189,248,0.2)\';save();draw()"></span>' +
            '<span class="dot" style="background:#c084fc" onclick="notes['+idx+'].bg=\'rgba(192,132,252,0.2)\';save();draw()"></span>' +
            '<span class="dot" style="background:#34d399" onclick="notes['+idx+'].bg=\'rgba(52,211,153,0.2)\';save();draw()"></span>' +
            '<span class="dot" style="background:#fbbf24" onclick="notes['+idx+'].bg=\'rgba(251,191,36,0.2)\';save();draw()"></span>' +
          '</div>' +
        '</div>' +
        '<textarea style="font-family:'+n.font+';color:'+n.color+'" oninput="notes['+idx+'].text=this.value;save()">'+n.text+'</textarea>' +
        '<div class="actions">' +
          '<button onclick="copyIt('+idx+',\'plain\')">📋 Copy</button>' +
          '<button onclick="copyIt('+idx+',\'md\')">📝 MD</button>' +
          '<button onclick="copyIt('+idx+',\'upper\')">🔠 ABC</button>' +
        '</div>';
      g.appendChild(d);
    })(i);
  }
}
draw();
</script>
</body>
</html>

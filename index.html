<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Pro Workbench</title>
  <!-- Google Fonts for Typography Options -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* Header & Top Controls */
    header {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(to right, #38bdf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button, select {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button:hover, select:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    button.primary {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      border: none;
      font-weight: 600;
    }

    button.primary:hover {
      opacity: 0.9;
    }

    select option {
      background: #1e293b;
      color: #f8fafc;
    }

    /* Bento Grid Layout */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      flex: 1;
    }

    /* Note Card */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s, background 0.3s;
    }

    /* Card Color Tints */
    .card[data-tint="blue"] { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.35); }
    .card[data-tint="purple"] { background: rgba(192, 132, 252, 0.12); border-color: rgba(192, 132, 252, 0.35); }
    .card[data-tint="green"] { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.35); }
    .card[data-tint="amber"] { background: rgba(251, 191, 36, 0.12); border-color: rgba(251, 191, 36, 0.35); }
    .card[data-tint="rose"] { background: rgba(251, 113, 133, 0.12); border-color: rgba(251, 113, 133, 0.35); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .card-title {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      outline: none;
    }

    .card-title::placeholder {
      color: var(--text-muted);
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: none;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .delete-btn:hover {
      background: rgba(239, 68, 68, 0.35);
    }

    /* Card Toolbar (Fonts & Colors) */
    .card-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .color-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.4);
      padding: 0;
    }

    .dot[data-color="default"] { background: #334155; }
    .dot[data-color="blue"] { background: #38bdf8; }
    .dot[data-color="purple"] { background: #c084fc; }
    .dot[data-color="green"] { background: #34d399; }
    .dot[data-color="amber"] { background: #fbbf24; }
    .dot[data-color="rose"] { background: #fb7185; }

    /* Text Area */
    textarea {
      width: 100%;
      min-height: 150px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    /* Smart Copy Actions */
    .copy-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .copy-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .copy-btn {
      font-size: 0.75rem;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.12);
    }

    .stats {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #064e3b;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>⚡ Bento Workbench</h1>
    </div>
    <div class="controls">
      <button class="primary" onclick="addCard()">+ New Card</button>
      <button onclick="exportAll()">⬇ Export .TXT</button>
      <select id="bgSelect" onchange="changeBg(this.value)">
        <option value="linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)">Midnight Aurora</option>
        <option value="linear-gradient(135deg, #090d16 0%, #111827 100%)">OLED Stealth</option>
        <option value="linear-gradient(135deg, #064e3b 0%, #0f172a 100%)">Emerald Night</option>
        <option value="linear-gradient(135deg, #4c1d95 0%, #831843 100%)">Cyber Berry</option>
      </select>
    </div>
  </header>

  <main class="bento-grid" id="grid"></main>

  <div id="toast">Copied to clipboard!</div>

  <script>
    let notes = JSON.parse(localStorage.getItem('bento_workbench_notes')) || [
      {
        id: Date.now(),
        title: 'Quick Scratchpad',
        text: 'Welcome to your Frosted Glass Workbench! Type anything here, switch fonts or card colors, and use the buttons below to copy in 1 click.',
        font: "'Inter', sans-serif",
        tint: 'blue',
        textColor: '#f8fafc'
      }
    ];

    const savedBg = localStorage.getItem('bento_workbench_bg');
    if (savedBg) {
      document.documentElement.style.setProperty('--bg-gradient', savedBg);
      document.getElementById('bgSelect').value = savedBg;
    }

    function saveNotes() {
      localStorage.setItem('bento_workbench_notes', JSON.stringify(notes));
    }

    function changeBg(val) {
      document.documentElement.style.setProperty('--bg-gradient', val);
      localStorage.setItem('bento_workbench_bg', val);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function addCard() {
      notes.unshift({
        id: Date.now(),
        title: '',
        text: '',
        font: "'Inter', sans-serif",
        tint: 'default',
        textColor: '#f8fafc'
      });
      saveNotes();
      render();
    }

    function deleteCard(id) {
      if (notes.length === 1) {
        showToast('Keep at least one card!');
        return;
      }
      notes = notes.filter(n => n.id !== id);
      saveNotes();
      render();
    }

    function updateNote(id, field, value) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note[field] = value;
        saveNotes();
        if (field === 'tint' || field === 'font' || field === 'textColor') {
          render();
        } else if (field === 'text') {
          const statEl = document.getElementById(`stat-${id}`);
          if (statEl) statEl.textContent = getStats(value);
        }
      }
    }

    function getStats(text) {
      const chars = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      return `${words} words • ${chars} chars`;
    }

    function copyText(id, mode) {
